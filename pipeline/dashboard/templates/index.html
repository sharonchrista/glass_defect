<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hybrid Glass Defect Detection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --accent: #3fb950; --bad: #f85149; --text: #c9d1d9; --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 16px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); cursor: pointer; font-size: 14px;
  }
  .tab-btn.active { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .panel img { width: 100%; display: block; border-radius: 6px; background: #000; min-height: 200px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 12px 0; }
  .stat-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .stat-row span:last-child { font-weight: 600; }
  .verdict { font-size: 24px; font-weight: 700; text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
  .verdict.clean { background: rgba(63,185,80,0.15); color: var(--accent); }
  .verdict.defective { background: rgba(248,81,73,0.15); color: var(--bad); }
  .verdict.noglass { background: rgba(139,148,158,0.15); color: var(--muted); }
  button.action { width: 100%; padding: 10px; background: var(--accent); color: #0d1117; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 8px; }
  input[type=file] { width: 100%; margin-bottom: 8px; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>Hybrid Glass Defect Detection — PatchCore + YOLO</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('live')" id="tabLiveBtn">Live Camera</button>
  <button class="tab-btn" onclick="switchTab('upload')" id="tabUploadBtn">Upload Image</button>
</div>

<div class="layout">
  <div class="panel" id="livePanel">
    <img src="/video_feed" alt="Live feed">
  </div>
  <div class="panel hidden" id="uploadPanel">
    <input type="file" id="fileInput" accept="image/*">
    <button class="action" onclick="uploadImage()">Analyze Image</button>
    <img id="uploadResultImg" style="margin-top: 12px; display:none;">
  </div>

  <div class="side">
    <div class="card">
      <div class="verdict" id="verdictBox">--</div>
      <div class="stat-row"><span>PatchCore Score</span><span id="pcScore">--</span></div>
      <div class="stat-row"><span>YOLO Confidence</span><span id="yoloConf">--</span></div>
      <div class="stat-row"><span>Detected Classes</span><span id="classes">--</span></div>
      <div class="stat-row"><span>Zero-shot Guess</span><span id="zeroShot">--</span></div>
      <div class="stat-row"><span>Reason</span><span id="reason">--</span></div>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('livePanel').classList.toggle('hidden', tab !== 'live');
  document.getElementById('uploadPanel').classList.toggle('hidden', tab !== 'upload');
  document.getElementById('tabLiveBtn').classList.toggle('active', tab === 'live');
  document.getElementById('tabUploadBtn').classList.toggle('active', tab === 'upload');
}

function renderResult(data) {
  const verdictBox = document.getElementById('verdictBox');
  verdictBox.textContent = data.prediction || '--';
  let cls = 'clean';
  if (data.prediction === 'DEFECTIVE') cls = 'defective';
  else if (data.prediction === 'NO GLASS') cls = 'noglass';
  verdictBox.className = 'verdict ' + cls;
  document.getElementById('pcScore').textContent = data.patchcore_score ?? '--';
  document.getElementById('yoloConf').textContent = data.yolo_confidence ?? '--';
  document.getElementById('classes').textContent = (data.detected_classes && data.detected_classes.length) ? data.detected_classes.join(', ') : 'none';
  document.getElementById('zeroShot').textContent = data.zero_shot_label ? `${data.zero_shot_label} (${data.zero_shot_confidence})` : '--';
  document.getElementById('reason').textContent = data.reason || '--';
}

async function pollLive() {
  if (document.getElementById('livePanel').classList.contains('hidden')) return;
  try {
    const res = await fetch('/live_status');
    const data = await res.json();
    renderResult(data);
  } catch (e) { /* ignore transient errors */ }
}
setInterval(pollLive, 1000);
pollLive();

async function uploadImage() {
  const input = document.getElementById('fileInput');
  if (!input.files.length) { alert('Choose an image first'); return; }
  const formData = new FormData();
  formData.append('image', input.files[0]);

  const res = await fetch('/predict_upload', { method: 'POST', body: formData });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }

  renderResult(data);
  const img = document.getElementById('uploadResultImg');
  img.src = data.annotated_image;
  img.style.display = 'block';
}
</script>

</body>
</html>
